<title>Anima — Casal novo (lote Template 2)</title>
<style>
:root{--bg:#0c0e0d;--card:#161a18;--cb:#232a26;--ink:#f3f6f4;--muted:#9aa49e;--acc:#37d137}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif}
header{padding:26px 24px;border-bottom:1px solid var(--cb)}
header h1{margin:0 0 6px;font-size:22px}
header p{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
main{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));padding:24px}
figure{margin:0;background:var(--card);border:1px solid var(--cb);border-radius:12px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
figcaption{padding:10px 12px;font-size:13px;line-height:1.5}
.t{color:var(--ink);font-weight:600}.g{color:var(--muted);font-size:12px}
.b{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:4px}
.b-ok{background:rgba(55,209,55,.15);color:#5ee65e;border:1px solid rgba(55,209,55,.35)}
.b-skip{background:#20262300;color:var(--muted);border:1px solid var(--cb)}
.b-info{background:rgba(0,166,230,.12);color:#4bb8ee;border:1px solid rgba(0,166,230,.3)}
</style>
