<title>Anima Saúde — casal (5 p/ aprovação)</title>
<style>
:root{--bg:#0a0e12;--card:#12181f;--cb:#1e2a34;--ink:#eef4f8;--muted:#8aa0ad;--acc:#00afef}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Arial,sans-serif}
header{padding:26px 24px;border-bottom:1px solid var(--cb)}
header h1{margin:0 0 6px;font-size:22px}header h1 span{color:var(--acc)}
header p{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
main{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));padding:24px}
figure{margin:0;background:var(--card);border:1px solid var(--cb);border-radius:12px;overflow:hidden}
figure img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
figcaption{padding:10px 12px;font-size:13px;line-height:1.5}
figcaption b{color:var(--acc)}figcaption span{color:var(--muted);font-size:12px}
</style>
<header><h1>Anima <span>Saúde</span> — casal de apresentadores (5 para aprovação)</h1>
<p>Novo casal do Anima Saúde inserido à esquerda (na frente da borda azul, atrás do texto), no mesmo padrão dos demais. Cópia de trabalho DAHT5dd2JhQ; o design original DAHRWqXOUCY foi preservado. Se aprovar, aplico aos 32 episódios do Saúde.</p></header>
